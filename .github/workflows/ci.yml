name: CI

# No `push: main` trigger here on purpose: deploy.yml already calls this
# workflow as its gate, so adding one would run the whole suite twice on
# every push to main.
on:
  pull_request:
  workflow_call: # deploy.yml gates on this

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check:types

      - name: Lint and format
        run: pnpm lint

      # Zero-config Next.js App Router detection — no manual entry list
      # needed (unlike the old Vite setup). knip.json only lists components
      # intentionally kept dormant: Button and Field (no non-link button or
      # contact form built — Contact is email-link-only, no server to handle
      # a form on static export), and Timeline/TimelineDivider (hidden on
      # the home page pending a decision).
      - name: Unused files, exports and dependencies
        run: pnpm knip

      # Deliberately --audit-level=high, not moderate.
      #
      # This is a static site: no server, no database, no user input, no secrets
      # in the bundle. Nearly every moderate advisory here will sit in build
      # tooling that never ships a byte to a visitor, and cannot be reached by
      # anyone loading the page. Gating on those trains you to ignore the signal,
      # which is worse than not having it. High and critical still block.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
